title = "JavaVerse Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Narrowly scoped allowlists for placeholder files, gitignored dev artifacts, and exact test fixture files"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)docs/.*''',
  '''(^|/)packages/schemas/test/env\.test\.ts$''',
  '''(^|/)apps/web/test/setup\.ts$''',
  '''(^|/)apps/web/test/e2e/auth\.spec\.ts$''',
  '''(^|/)\.env\.local$''',
  '''(^|/)packages/db/\.env$''',
  '''(^|/)\.next/.*''',
  '''(^|/)\.turbo/.*''',
]

[[rules]]
id = "jwt"
[rules.allowlist]
description = "Narrowly scoped allowlist for the synthetic test JWT fixture in piiScrubber.test.ts"
condition = "AND"
paths = [
  '''(^|/)packages/security/test/piiScrubber\.test\.ts$''',
]
regexes = [
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.doNotLeakThisSignature12345$''',
]

[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "Narrowly scoped allowlist for the synthetic test Anthropic key fixture in providers-compliance.test.ts"
condition = "AND"
paths = [
  '''(^|/)packages/ai/test/providers-compliance\.test\.ts$''',
]
regexes = [
  '''^test-secret-anthropic-key-67890$''',
]
